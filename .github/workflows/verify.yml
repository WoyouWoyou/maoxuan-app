name: Verify architecture and desktop workflows

on:
  pull_request:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Exercise Electron with isolated data and a local fake model
        run: node scripts/smoke-multibook.mjs
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-screenshots
          path: output/qa
          if-no-files-found: ignore
