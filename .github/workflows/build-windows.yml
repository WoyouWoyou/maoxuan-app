name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '.github/workflows/build-windows.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'tsconfig*.json'
      - 'src/**'
      - 'resources/**'
      - 'tests/**'
      - 'scripts/**'
      - 'vitest.config.ts'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2022
            command: npm run dist:win
            installer: '*-windows-x64-setup.exe'
            artifact: maoxuan-windows-x64
          - platform: macOS Apple Silicon
            runner: macos-15
            command: npm run dist -- --arm64 --publish never
            installer: '*.dmg'
            artifact: maoxuan-macos-arm64
          - platform: macOS Intel
            runner: macos-15-intel
            command: npm run dist -- --x64 --publish never
            installer: '*.dmg'
            artifact: maoxuan-macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and rebuild native modules
        run: npm ci
      - name: Check module boundaries
        run: npm run check:boundaries
      - name: Run regression tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build installer
        run: ${{ matrix.command }}
      - name: Generate SHA256 checksum
        working-directory: dist
        shell: pwsh
        env:
          INSTALLER_PATTERN: ${{ matrix.installer }}
        run: |
          $installers = @(Get-ChildItem -File -Filter $env:INSTALLER_PATTERN)
          if ($installers.Count -ne 1) { throw 'Expected exactly one desktop installer' }
          $installer = $installers[0]
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.installer }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
